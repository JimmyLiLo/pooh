  <style>
    /* ── room 頁專用 ── */
    .room-container {
      max-width: var(--max-width);
      margin: 0 auto;
    }

    /* 房型頁籤 */
    .room-tabs {
      display: flex;
      flex-wrap: wrap;
      background-color: #2a2510;
      border-bottom: 1px solid #3a3018;
    }

    .room-tabs button {
      flex: 1 1 auto;
      min-width: 140px;
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      color: var(--color-sand);
      letter-spacing: 0.04em;
      padding: 0.9rem 0.6rem;
      border: none;
      border-right: 1px solid #3a3018;
      background: none;
      cursor: pointer;
      text-align: center;
      transition: background-color var(--transition), color var(--transition);
    }

    .room-tabs button:last-child {
      border-right: none;
    }

    .room-tabs button:hover {
      background-color: rgba(200,151,58,0.1);
      color: var(--color-gold);
    }

    .room-tabs button.is-active {
      background-color: var(--color-gold);
      color: var(--color-white);
      font-weight: 500;
    }

    /* 房型詳情區 */
    .room-detail {
      background-color: #241f10;
      padding: var(--space-lg);
    }

    .room-detail-title {
      font-family: var(--font-body);
      font-size: var(--text-lg);
      color: var(--color-gold);
      margin-bottom: 1rem;
      letter-spacing: 0.08em;
    }

    /* 房價 */
    .room-price {
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      color: var(--color-sand);
      line-height: 2;
      margin-bottom: 1.2rem;
    }

    .room-price .price-label {
      color: var(--color-sand-dk);
    }

    .room-price .price-value {
      color: var(--color-gold);
      font-weight: 600;
      margin-right: 1.2rem;
    }

    /* 客房設施表格 */
    .room-amenities-title {
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      color: var(--color-sand);
      margin-bottom: 0.5rem;
    }

    .room-amenities {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
    }

    .room-amenities td {
      border: 1px solid #3a3018;
      padding: 0.6rem 0.8rem;
      font-family: var(--font-ui);
      font-size: var(--text-xs);
      color: var(--color-sand);
      line-height: 1.7;
    }

    .room-amenities td.full-row {
      background-color: rgba(200,151,58,0.05);
    }

    /* 待補資料提示 */
    .room-todo {
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      color: var(--color-sand-dk);
      padding: 2rem;
      text-align: center;
      border: 1px dashed #4a3f28;
      border-radius: 4px;
      margin-bottom: 1.5rem;
    }

    /* 輪播 */
    .room-slideshow {
      position: relative;
      background-color: #000;
      overflow: hidden;
      border-radius: 4px;
      margin-bottom: 0.6rem;
    }

    .room-slideshow-track {
      position: relative;
      width: 100%;
      aspect-ratio: 800 / 480;
    }

    .room-slideshow-track img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .room-slideshow-track img.is-active {
      opacity: 1;
      position: relative;
    }

    .room-slideshow-pagination {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .room-slideshow-pagination button {
      flex: 1 0 auto;
      padding: 0;
      border: 2px solid transparent;
      background: none;
      cursor: pointer;
      line-height: 0;
      border-radius: 3px;
      overflow: hidden;
      opacity: 0.55;
      transition: opacity var(--transition), border-color var(--transition);
    }

    .room-slideshow-pagination button img {
      width: 100%;
      height: auto;
      display: block;
    }

    .room-slideshow-pagination button.is-active,
    .room-slideshow-pagination button:hover {
      opacity: 1;
      border-color: var(--color-gold);
    }

    /* 快速連結列 */
    .room-quicklinks {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0;
      padding: 1rem var(--space-md);
      background-color: #2a2510;
      border-top: 1px solid #3a3018;
    }

    .room-quicklinks a {
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      color: var(--color-sand);
      letter-spacing: 0.06em;
      padding: 4px 1.1rem;
      border-right: 1px solid rgba(200,180,150,0.3);
      transition: color var(--transition);
    }

    .room-quicklinks a:last-child {
      border-right: none;
    }

    .room-quicklinks a:hover {
      color: var(--color-gold);
    }

    /* room-quicklinks 改用 button，維持相同外觀 */
    .room-quicklinks button.quicklink-btn {
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      color: var(--color-sand);
      letter-spacing: 0.06em;
      padding: 4px 1.1rem;
      border: none;
      border-right: 1px solid rgba(200,180,150,0.3);
      background: none;
      cursor: pointer;
      transition: color var(--transition);
    }

    .room-quicklinks button.quicklink-btn:last-child {
      border-right: none;
    }

    .room-quicklinks button.quicklink-btn:hover {
      color: var(--color-gold);
    }

    /* ── 資訊彈窗 Modal（取代訂房需知等獨立頁面） ── */
    .info-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background-color: rgba(10, 8, 4, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .info-modal.is-open {
      display: flex;
    }

    .info-modal-box {
      background-color: #241f10;
      border: 1px solid #4a3f28;
      border-radius: 6px;
      max-width: 640px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: var(--space-lg);
      box-shadow: 0 10px 50px rgba(0,0,0,0.6);
      position: relative;
    }

    .info-modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: 1px solid rgba(200,180,150,0.3);
      color: var(--color-sand);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      transition: background-color var(--transition), color var(--transition);
    }

    .info-modal-close:hover {
      background-color: var(--color-gold);
      color: var(--color-white);
      border-color: var(--color-gold);
    }

    .info-modal-title {
      font-family: var(--font-body);
      font-size: var(--text-lg);
      color: var(--color-gold);
      text-align: center;
      letter-spacing: 0.1em;
      margin-bottom: 0.8rem;
    }

    .info-modal-divider {
      height: 1px;
      background-color: #4a3f28;
      margin-bottom: 1.2rem;
    }

    .info-modal-body {
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      color: var(--color-sand);
      line-height: 1.9;
    }

    .info-modal-body ul {
      list-style: none;
      padding: 0;
    }

    .info-modal-body li {
      position: relative;
      padding-left: 1.1rem;
      margin-bottom: 0.7rem;
    }

    .info-modal-body li::before {
      content: '‧';
      position: absolute;
      left: 0;
      color: var(--color-gold);
    }

    .info-modal-body .hl-yellow {
      color: #ffe27a;
    }

    .info-modal-body .hl-orange {
      color: #ffb366;
      font-weight: 600;
    }

    .info-modal-body .modal-note {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px dashed #4a3f28;
    }

    @media (max-width: 640px) {
      .room-tabs button {
        min-width: 33%;
        font-size: var(--text-xs);
      }

      .room-detail {
        padding: var(--space-md);
      }

      .room-amenities td {
        font-size: 0.68rem;
        padding: 0.4rem 0.5rem;
      }

      .info-modal-box {
        padding: var(--space-md);
      }
    }
  </style>

    /* ==============================================
       純 ES6 房型頁籤 + 輪播邏輯
       ============================================== */
    (() => {
      const tabsEl   = document.getElementById('roomTabs');
      const detailEl = document.getElementById('roomDetail');

      let currentRoomIndex = roomsData.findIndex(r => r.ready) >= 0
        ? roomsData.findIndex(r => r.ready)
        : 0;

      let slideIndex = 0;
      let slideTimer = null;

      // 產生頁籤
      const renderTabs = () => {
        tabsEl.innerHTML = '';
        roomsData.forEach((room, i) => {
          const btn = document.createElement('button');
          btn.textContent = room.name;
          if (i === currentRoomIndex) btn.classList.add('is-active');
          btn.addEventListener('click', () => {
            currentRoomIndex = i;
            slideIndex = 0;
            renderTabs();
            renderDetail();
          });
          tabsEl.appendChild(btn);
        });
      };

      // 產生詳情內容
      const renderDetail = () => {
        clearInterval(slideTimer);
        const room = roomsData[currentRoomIndex];

        if (!room.ready) {
          detailEl.innerHTML = `
            <h2 class="room-detail-title">${room.name}</h2>
            <div class="room-todo">此房型資料準備中，敬請期待</div>
          `;
          return;
        }

        // 房價
        const priceHtml = room.prices
          .map(p => `<span class="price-label">${p.label}：</span><span class="price-value">${p.value}</span>`)
          .join('　　');

        // 設施表格
        const amenitiesHtml = room.amenities
          .map(row => {
            if (row.length === 1) {
              return `<tr><td class="full-row" colspan="6">${row[0]}</td></tr>`;
            }
            return `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`;
          })
          .join('');
        // <div class="room-price">房價：　${priceHtml}</div>
        detailEl.innerHTML = `
          <h2 class="room-detail-title">${room.name}</h2>

          <div class="room-amenities-title">客房設施</div>
          <table class="room-amenities"><tbody>${amenitiesHtml}</tbody></table>

          <div class="room-slideshow">
            <div class="room-slideshow-track" id="roomSlideTrack"></div>
          </div>
          <div class="room-slideshow-pagination" id="roomSlidePagination"></div>
        `;

        renderSlideshow(room);
      };

      // 產生輪播
      const renderSlideshow = (room) => {
        const trackEl = document.getElementById('roomSlideTrack');
        const pagiEl  = document.getElementById('roomSlidePagination');

        trackEl.innerHTML = room.photos.map((p, i) => `
          <img src="${room.photosFolder}${p.full}" alt="${room.name} ${i + 1}" class="${i === 0 ? 'is-active' : ''}" />
        `).join('');

        pagiEl.innerHTML = room.photos.map((p, i) => `
          <button class="${i === 0 ? 'is-active' : ''}" data-index="${i}">
            <img src="${room.photosFolder}${p.thumb}" alt="縮圖${i + 1}" />
          </button>
        `).join('');

        const slides = trackEl.querySelectorAll('img');
        const dots   = pagiEl.querySelectorAll('button');

        const goTo = (index) => {
          slides[slideIndex].classList.remove('is-active');
          dots[slideIndex].classList.remove('is-active');
          slideIndex = (index + slides.length) % slides.length;
          slides[slideIndex].classList.add('is-active');
          dots[slideIndex].classList.add('is-active');
        };

        dots.forEach((dot, i) => {
          dot.addEventListener('click', () => {
            goTo(i);
            startAutoplay();
          });
        });

        const startAutoplay = () => {
          clearInterval(slideTimer);
          if (slides.length <= 1) return;
          slideTimer = setInterval(() => goTo(slideIndex + 1), 4000);
        };

        startAutoplay();
      };

      renderTabs();
      renderDetail();
    })();

    /* ==============================================
       純 ES6 彈窗控制
       ============================================== */
    (() => {
      const modal      = document.getElementById('infoModal');
      const modalTitle = document.getElementById('infoModalTitle');
      const modalBody  = document.getElementById('infoModalBody');
      const modalClose = document.getElementById('infoModalClose');

      const openModal = (key) => {
        const data = infoModalData[key];
        if (!data) return;
        modalTitle.textContent = data.title;
        modalBody.innerHTML = data.html;
        modal.classList.add('is-open');
      };

      const closeModal = () => {
        modal.classList.remove('is-open');
      };

      document.querySelectorAll('[data-modal]').forEach(btn => {
        btn.addEventListener('click', () => openModal(btn.dataset.modal));
      });

      modalClose.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal(); // 點背景關閉
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
      });
    })();
  </script>
